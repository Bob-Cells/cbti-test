name: Build Static CBTI Site

on:
  workflow_dispatch:  # 允许手动触发构建

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Patch next.config.ts for static export
        run: |
          CONFIG_FILE="next.config.ts"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ 错误：找不到 $CONFIG_FILE 文件！"
            exit 1
          fi
          node -e "
          const fs = require('fs');
          let config = fs.readFileSync('$CONFIG_FILE', 'utf8');

          // 1. 确保 output: 'export' 存在（不重复添加）
          if (!/output\s*:\s*['\"]export['\"]/.test(config)) {
            // 如果已经有 output 属性但值不是 export，则替换；否则在 nextConfig 开头插入
            if (/output\s*:/.test(config)) {
              config = config.replace(/output\s*:\s*['\"]?[^'\",}]*['\"]?/, 'output: \"export\"');
            } else {
              config = config.replace(/(const nextConfig[^=]*=\s*\{)/, '\$1\n  output: \"export\",');
            }
          }

          // 2. 确保 images: { unoptimized: true } 存在，且不重复
          if (!/images\s*:/.test(config)) {
            // 完全没有 images 配置，直接插入
            config = config.replace(/(const nextConfig[^=]*=\s*\{)/, '\$1\n  images: {\n    unoptimized: true,\n  },');
          } else {
            // 已有 images 对象，检查是否已有 unoptimized 属性
            if (!/unoptimized\s*:/.test(config.match(/images\s*:\s*\{[^}]*\}/s)?.[0] || '')) {
              // 没有 unoptimized，则在 images 对象内添加
              config = config.replace(/(images\s*:\s*\{)/, '\$1\n    unoptimized: true,');
            }
            // 如果已经有了 unoptimized，不做任何修改
          }

          console.log('修改后的 next.config.ts 内容：');
          console.log(config);
          fs.writeFileSync('$CONFIG_FILE', config);
          "

      - name: Build static files
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: npm run build

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: cbti-static
          path: out
