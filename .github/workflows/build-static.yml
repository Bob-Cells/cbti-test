name: Build Static CBTI Site

on:
  workflow_dispatch:  # 允许手动触发构建

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20   # ✅ 这里改成了 20，满足 Next.js 的最低要求

      - name: Install dependencies
        run: npm install

      - name: Patch next.config.ts for static export
        run: |
          CONFIG_FILE="next.config.ts"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ 错误：找不到 $CONFIG_FILE 文件！"
            exit 1
          fi
          node -e "
          const fs = require('fs');
          let config = fs.readFileSync('$CONFIG_FILE', 'utf8');

          // 确保 output: 'export' 存在
          if (!config.includes('output:')) {
            config = config.replace(
              /(const nextConfig[^=]*=\s*\{)/,
              '\$1\n  output: \"export\",'
            );
          } else {
            config = config.replace(
              /output:\s*['\"]?[^'\",}]*['\"]?/,
              'output: \"export\"'
            );
          }

          // 确保 images: { unoptimized: true } 存在
          if (!config.includes('images:')) {
            config = config.replace(
              /(const nextConfig[^=]*=\s*\{)/,
              '\$1\n  images: {\n    unoptimized: true,\n  },'
            );
          } else {
            config = config.replace(
              /(images:\s*\{)/,
              '\$1\n    unoptimized: true,'
            );
          }

          console.log('修改后的 next.config.ts 内容：');
          console.log(config);
          fs.writeFileSync('$CONFIG_FILE', config);
          "

      - name: Build static files
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: npm run build

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: cbti-static
          path: out
